allowBuilds:
  core-js-pure: true
  esbuild: true
  workerd: true

# Our own packages are trusted the day they are released; everything else waits out pnpm's
# minimumReleaseAge supply-chain delay.
minimumReleaseAgeExclude:
  - '@zeyolabs/*'
  - stripe@23.2.0

overrides:
  sharp: 0.35.5
  undici: 8.13.1
